<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katale</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333333;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 28px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }
        .btn-secondary {
            background-color: #e9ecef;
            color: #495057;
        }
        .btn:active { transform: scale(0.98); }
        
        .tiktok-notice {
            display: none;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="tiktok-notice" class="tiktok-notice">
            ⚡ Redirecting to Katale App...
        </div>

        <h2 id="status-text" style="margin: 0 0 8px 0; color: #2e7d32; font-size: 22px;">Katale Shop</h2>
        <p id="sub-text" style="margin: 0 0 20px 0; color: #666; font-size: 14px;">Opening Katale App...</p>
        
        <!-- Primary App Launch Button -->
        <a id="app-btn" class="btn btn-primary" href="#">🚀 OPEN IN KATALE APP</a>
        
        <!-- Secondary Fallback Button -->
        <a id="store-btn" class="btn btn-secondary" href="#">🛒 GET IT ON GOOGLE PLAY</a>
    </div>

    <script>
        (function enforceAppLaunch() {
            const PACKAGE_NAME = "hizstar.aplicjvg";
            const PLAY_STORE_URL = `https://play.google.com/store/apps/details?id=${PACKAGE_NAME}`;

            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isTikTok = /TikTok|musical_ly/i.test(ua);
            const isAndroid = /Android/i.test(ua);

            // Extract Shop / User ID from URL
            const currentPath = window.location.pathname;
            const pathSegments = currentPath.split('/');
            const userIndex = pathSegments.indexOf('user');
            
            let shopId = "";
            if (userIndex !== -1 && pathSegments[userIndex + 1]) {
                shopId = pathSegments[userIndex + 1];
            } else {
                const urlParams = new URLSearchParams(window.location.search);
                shopId = urlParams.get('shop') || urlParams.get('id') || "";
            }

            const appBtn = document.getElementById('app-btn');
            const storeBtn = document.getElementById('store-btn');
            const tiktokNotice = document.getElementById('tiktok-notice');

            // Strict Intent URI forcing package match to hizstar.aplicjvg
            const targetHostPath = `ka-cyber-dot.github.io/Katale-/index2.html?shop=${shopId}`;
            const intentUri = `intent://${targetHostPath}#Intent;scheme=https;package=${PACKAGE_NAME};action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url=${encodeURIComponent(PLAY_STORE_URL)};end;`;

            storeBtn.href = PLAY_STORE_URL;
            appBtn.href = intentUri;

            function launchApp() {
                appBtn.innerText = "⏳ Opening Katale...";
                appBtn.style.opacity = "0.8";

                const startTime = Date.now();
                
                // Enforce launch attempt
                window.location.href = intentUri;

                // Fallback Timer: If app isn't installed (user remains on web page), go to Play Store
                setTimeout(() => {
                    if (Date.now() - startTime < 1500) {
                        window.location.href = PLAY_STORE_URL;
                    }
                }, 700);
            }

            // Direct tap event (bypasses browser security locks)
            appBtn.addEventListener('click', function(e) {
                e.preventDefault();
                launchApp();
            });

            if (!isAndroid) {
                // Desktop Browser: Go straight to Google Play Store web page
                window.location.href = PLAY_STORE_URL;
            } else {
                if (isTikTok) {
                    tiktokNotice.style.display = 'block';
                }

                // Enforce auto-launch 100ms after DOM is fully loaded
                setTimeout(() => {
                    launchApp();
                }, 100);
            }
        })();
    </script>
</body>
</html>
