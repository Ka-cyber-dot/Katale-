<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katale</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333333;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
        }
        .btn {
            margin-top: 15px;
            padding: 16px 28px;
            background-color: #4CAF50;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            display: inline-block;
        }
        /* Special banner for TikTok/Instagram webviews */
        .webview-warning {
            display: none;
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Banner shown ONLY inside TikTok/Instagram/Facebook -->
        <div id="webview-banner" class="webview-warning">
            ⚠️ <strong>Opening from TikTok?</strong><br>
            If the app doesn't open, tap the <strong>3 dots (⋮)</strong> at the top right and select <strong>"Open in Browser"</strong>.
        </div>

        <h2 id="status-text" style="margin: 0 0 10px 0; color: #2e7d32;">Connecting...</h2>
        <p id="sub-text" style="margin: 0; color: #666; font-size: 14px;">Opening Katale App</p>
        
        <a id="action-btn" class="btn" href="#">🚀 OPEN IN KATALE APP</a>
    </div>

    <script>
        (function crossPlatformRedirect() {
            const PACKAGE_NAME = "hizstar.aplicjvg";
            const PLAY_STORE_URL = `https://play.google.com/store/apps/details?id=${PACKAGE_NAME}`;

            // Detect In-App WebViews (TikTok, Instagram, Facebook, Line, Twitter)
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isInAppWebView = /TikTok|musical_ly|FBAN|FBAV|Instagram|Line|Twitter/i.test(ua);
            const isAndroid = /Android/i.test(ua);

            // Show instruction banner if opened inside TikTok/Instagram
            if (isInAppWebView) {
                document.getElementById('webview-banner').style.display = 'block';
            }

            // Extract Shop ID
            const currentPath = window.location.pathname;
            const pathSegments = currentPath.split('/');
            const userIndex = pathSegments.indexOf('user');
            
            let shopId = "";
            if (userIndex !== -1 && pathSegments[userIndex + 1]) {
                shopId = pathSegments[userIndex + 1];
            } else {
                const urlParams = new URLSearchParams(window.location.search);
                shopId = urlParams.get('shop') || urlParams.get('id') || "";
            }

            const actionBtn = document.getElementById('action-btn');
            const targetHostPath = `ka-cyber-dot.github.io/Katale-/index2.html?shop=${shopId}`;
            const intentUri = `intent://${targetHostPath}#Intent;scheme=https;package=${PACKAGE_NAME};S.browser_fallback_url=${encodeURIComponent(PLAY_STORE_URL)};end;`;

            actionBtn.href = intentUri;

            function launchApp() {
                const startTime = Date.now();
                window.location.href = intentUri;

                // Fallback to Play Store if app is not installed
                setTimeout(() => {
                    if (Date.now() - startTime < 2500) {
                        window.location.href = PLAY_STORE_URL;
                    }
                }, 1500);
            }

            // In-app browsers require an EXPLICIT touch event
            actionBtn.addEventListener('click', function(e) {
                e.preventDefault();
                launchApp();
            });

            // Try auto-launch only if NOT in strict in-app browsers
            if (isAndroid && !isInAppWebView) {
                launchApp();
            }
        })();
    </script>
</body>
</html>
