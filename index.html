<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katale - Opening App...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
            color: #333;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a.manual-btn {
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p id="status-text">Opening Katale App...</p>
    <a id="fallback-btn" class="manual-btn" style="display:none;" href="#">Open Katale App</a>

    <script>
        (function redirectToApp() {
            const playStoreUrl = "https://play.google.com/store/apps/details?id=hizstar.aplicjvg";
            
            // 1. Extract path from URL (e.g., /Katale-/user/6a23d05623e13531872ea452)
            const currentPath = window.location.pathname;
            const pathSegments = currentPath.split('/');
            
            // Find where 'user' is located in the path
            const userIndex = pathSegments.indexOf('user');
            let targetShopId = null;

            if (userIndex !== -1 && pathSegments[userIndex + 1]) {
                targetShopId = pathSegments[userIndex + 1];
            } else {
                // Fallback check for query parameter ?shop= or ?id=
                const urlParams = new URLSearchParams(window.location.search);
                targetShopId = urlParams.get('shop') || urlParams.get('id');
            }

            // 2. If a valid shop ID was found, construct your native intent URI
            if (targetShopId) {
                const nativeAppIntentUri = `intent://ka-cyber-dot.github.io/Katale-/index2.html?shop=${targetShopId}#Intent;scheme=https;package=hizstar.aplicjvg;S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end`;

                // Set fallback button target
                const fallbackBtn = document.getElementById('fallback-btn');
                fallbackBtn.href = nativeAppIntentUri;

                // Attempt immediate client-side redirection
                window.location.replace(nativeAppIntentUri);

                // Show manual button after 1.5s if browser blocks automatic intent jump
                setTimeout(() => {
                    document.getElementById('status-text').innerText = "Tap below if the app didn't open automatically:";
                    fallbackBtn.style.display = "inline-block";
                }, 1500);
            } else {
                // Default fallback if no ID is present
                window.location.replace(playStoreUrl);
            }
        })();
    </script>
</body>
</html>
