<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KATALE</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #ffffff;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }
        #loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .katale-text {
            font-size: 70px;
            font-weight: 900;
            fill: #4CAF50;
            letter-spacing: 2px;
            filter: drop-shadow(0 2px 0 #388E3C) 
                    drop-shadow(0 4px 0 #2E7D32) 
                    drop-shadow(0 12px 10px rgba(0,0,0,0.15));
        }
        .hizstar-text {
            font-size: 14px;
            fill: #a5d6a7;
            letter-spacing: 10px;
            text-transform: lowercase;
        }
        #status-text {
            margin-top: 15px;
            font-family: 'Helvetica', sans-serif;
            color: #4CAF50;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            padding: 0 20px;
        }
        /* DIRECT APP LAUNCHER BUTTON FOR EDGE / WEBVIEWS */
        #launch-app-btn {
            display: none;
            margin-top: 25px;
            padding: 16px 32px;
            background-color: #4CAF50;
            color: #ffffff;
            font-family: 'Helvetica', sans-serif;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 14px rgba(76, 175, 80, 0.4);
            text-align: center;
        }
        #loading-dot { fill: #2E7D32; }
    </style>
</head>
<body>
    <div id="loader-container">
        <svg width="320" height="260" viewBox="0 0 600 500">
            <text x="50%" y="250" text-anchor="middle" class="katale-text">KATALE</text>
            <text x="50%" y="315" text-anchor="middle" class="hizstar-text">hizstar</text>
            <path id="infinityPath" d="M 135,180 C 250,-50 250,550 465,180" fill="none" stroke="transparent" />
            <circle id="loading-dot" r="14">
                <animateMotion dur="2.2s" repeatCount="indefinite" rotate="auto">
                    <mpath href="#infinityPath" />
                </animateMotion>
            </circle>
        </svg>

        <div id="status-text">CONNECTING 0%</div>

        <!-- THIS BUTTON GUARANTEES OVERRIDING BROWSER/WEBVIEW BLOCKS -->
        <a id="launch-app-btn" href="#">🚀 OPEN KATALE APP</a>
    </div>

    <script>
        const BASE_URL = "https://my-businessi-app.onrender.com";
        const SIGNAL_URL = BASE_URL + "/api/heartbeat";
        const PACKAGE_NAME = "hizstar.aplicjvg"; // Your Android app package
            
        const loader = document.getElementById('loader-container');
        const statusText = document.getElementById('status-text');
        const launchBtn = document.getElementById('launch-app-btn');

        let progress = 0;
        let fakeLoader;
        let appLoaded = false;

        const sharedPath = window.location.pathname;
        const sharedQuery = window.location.search;

        function runPercentage(targetSpeed, maxPercent, messagePrefix) {
            clearInterval(fakeLoader);
            fakeLoader = setInterval(() => {
                if (progress < maxPercent) {
                    progress++;
                    statusText.innerText = `${messagePrefix || "CONNECTING"} ${progress}%`;
                }
            }, targetSpeed);
        }

        runPercentage(15, 50);
        setTimeout(() => { runPercentage(400, 90); }, 800);

        // Build target destination route
        let cleanRoute = sharedPath;
        if (cleanRoute.startsWith('/Katale-')) {
            cleanRoute = cleanRoute.replace('/Katale-', '');
        }
        let targetPath = (cleanRoute.includes('/user/')) ? cleanRoute + sharedQuery : (sharedQuery || "/");
        let fullDestination = BASE_URL + targetPath;

        // Construct direct Android Intent string for Edge/WebViews
        let androidIntentUrl = `intent://${BASE_URL.replace('https://', '')}${targetPath}#Intent;scheme=https;package=${PACKAGE_NAME};S.browser_fallback_url=${encodeURIComponent(fullDestination)};end;`;

        async function listenToSignal() {
            try {
                if (!appLoaded && progress >= 90) {
                    runPercentage(1000, 98, "SERVER WAKING UP...");
                }

                const response = await fetch(SIGNAL_URL + "?t=" + Date.now());
                const data = await response.json();

                if (data && data.signature === "HIZSTAR_ENGINE_FRESH_START") {
                    if (!appLoaded) {
                        appLoaded = true;
                        clearInterval(fakeLoader);
                        statusText.innerText = "READY!";

                        // Setup launch button for manual tap
                        launchBtn.href = androidIntentUrl;
                        launchBtn.style.display = "inline-block";

                        // Try standard automatic transfer
                        window.location.replace(androidIntentUrl);
                    }
                } else {
                    throw new Error("Invalid Engine Signature");
                }
            } catch (err) {
                console.log("Waiting for Render...");
                appLoaded = false;
                progress = 95;
                statusText.innerText = "TAP BELOW TO OPEN";
                
                // Show button as manual fallback
                launchBtn.href = androidIntentUrl;
                launchBtn.style.display = "inline-block";
            }

            if (!appLoaded) {
                setTimeout(listenToSignal, 3500);
            }
        }

        listenToSignal();
    </script>
</body>
</html>
