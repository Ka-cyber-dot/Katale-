<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katale</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333333;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
        }
        .spinner {
            border: 4px solid #e9ecef;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            margin-top: 20px;
            padding: 16px 32px;
            background-color: #4CAF50;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 14px rgba(76, 175, 80, 0.35);
            display: inline-block;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #43A047;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="spinner" class="spinner"></div>
        <h2 id="status-text" style="margin: 0 0 10px 0; color: #2e7d32;">Connecting...</h2>
        <p id="sub-text" style="margin: 0; color: #666; font-size: 14px;">Opening Katale App</p>
        
        <a id="action-btn" class="btn" href="#">GET KATALE ON GOOGLE PLAY</a>
    </div>

    <script>
        (function crossPlatformRedirect() {
            const PACKAGE_NAME = "hizstar.aplicjvg";
            const PLAY_STORE_URL = `https://play.google.com/store/apps/details?id=${PACKAGE_NAME}`;

            // 1. Detect device type (Android phone vs Computer/Desktop)
            const isAndroid = /Android/i.test(navigator.userAgent);

            // 2. Extract shop/user ID from URL path (/user/6a23d05623e13531872ea452) or query
            const currentPath = window.location.pathname;
            const pathSegments = currentPath.split('/');
            const userIndex = pathSegments.indexOf('user');
            
            let shopId = "";
            if (userIndex !== -1 && pathSegments[userIndex + 1]) {
                shopId = pathSegments[userIndex + 1];
            } else {
                const urlParams = new URLSearchParams(window.location.search);
                shopId = urlParams.get('shop') || urlParams.get('id') || "";
            }

            const actionBtn = document.getElementById('action-btn');
            const statusText = document.getElementById('status-text');
            const subText = document.getElementById('sub-text');
            const spinner = document.getElementById('spinner');

            if (!isAndroid) {
                // =========================================================
                // COMPUTER / DESKTOP / NON-ANDROID FLOW
                // =========================================================
                statusText.innerText = "Katale on Google Play";
                subText.innerText = "You are on a desktop browser. Redirecting to Google Play Store...";
                actionBtn.innerText = "🛒 VIEW ON GOOGLE PLAY";
                actionBtn.href = PLAY_STORE_URL;

                // Directly take computer user to the Google Play web store
                setTimeout(() => {
                    window.location.href = PLAY_STORE_URL;
                }, 1000);

            } else {
                // =========================================================
                // ANDROID MOBILE FLOW
                // =========================================================
                const targetHostPath = `ka-cyber-dot.github.io/Katale-/index2.html?shop=${shopId}`;
                const intentUri = `intent://${targetHostPath}#Intent;scheme=https;package=${PACKAGE_NAME};S.browser_fallback_url=${encodeURIComponent(PLAY_STORE_URL)};end;`;

                actionBtn.innerText = "🚀 OPEN IN KATALE APP";
                actionBtn.href = intentUri;

                function launchApp() {
                    const startTime = Date.now();
                    window.location.href = intentUri;

                    // Fallback timer: If app is NOT installed on the phone, force redirect to Play Store
                    setTimeout(() => {
                        const elapsedTime = Date.now() - startTime;
                        if (elapsedTime < 2500) {
                            window.location.href = PLAY_STORE_URL;
                        }
                    }, 1500);
                }

                // Attempt auto-launch on page load
                launchApp();

                // Direct tap event (bypasses browser security blocks on Android)
                actionBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    launchApp();
                });

                // Update UI after 2 seconds if page remains open
                setTimeout(() => {
                    spinner.style.display = "none";
                    statusText.innerText = "Open Katale App";
                    subText.innerText = "If the app or Play Store didn't open automatically, tap below:";
                }, 2000);
            }
        })();
    </script>
</body>
</html>
